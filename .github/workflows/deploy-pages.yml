name: Build and deploy static portfolio to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [master]
    paths:
      - 'index.html'
      - 'assets/images/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/assets/images
          cp index.html _site/index.html
          cp assets/images/amrshah.jpg _site/assets/images/amrshah.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
